<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptPay QR Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { 
            background: #f1f5f9; 
            font-family: 'Padauk', "Pyidaungsu", system-ui, -apple-system, sans-serif; 
        }
        .input-box, .select-box {
            font-size: 1rem;
            font-weight: bold;
            color: #0f172a;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 12px 14px;
            width: 100%;
            transition: all 0.2s;
        }
        .input-box:focus, .select-box:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
        }
        .btn-primary {
            background: linear-gradient(to right, #1d4ed8, #2563eb);
            color: white;
            font-weight: bold;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .btn-secondary {
            background: #ffffff;
            color: #1e293b;
            border: 2px solid #cbd5e1;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: #f8fafc; border-color: #94a3b8; }
        .btn-secondary:active { transform: scale(0.98); }
        
        .slip-container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            position: relative;
        }
        .slip-header {
            background: #113566;
            color: white;
            text-align: center;
            padding: 20px 15px;
        }
        .slip-body {
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }
        .qr-frame {
            background: white;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #f1f5f9;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">

    <button id="login-corner-btn" onclick="openLoginModal()" class="fixed top-3 right-3 z-40 bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-full shadow-md hover:bg-slate-700">
        🔐 Login
    </button>

    <div id="login-modal" class="hidden fixed inset-0 z-50 bg-black/40 items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 relative">
            <button onclick="closeLoginModal()" class="absolute top-3 right-4 text-2xl text-slate-400 hover:text-slate-700">×</button>
            <h2 class="font-bold text-slate-800 text-lg mb-4">🔐 Admin Login</h2>
            <div id="login-area">
                <input type="email" id="admin-email" class="input-box mb-3" placeholder="Admin Email">
                <input type="password" id="admin-password" class="input-box mb-3" placeholder="Password">
                <button id="btn-login" onclick="adminLogin()" class="btn-primary">Login ဝင်မည်</button>
            </div>
            <div id="logged-in-area" class="hidden">
                <p id="logged-in-email" class="text-sm font-bold text-green-600 break-all mb-3"></p>
                <hr class="my-3 border-slate-200">
                <p class="text-sm font-bold text-purple-700 mb-2">💾 PromptPay အကောင့် Save မည်</p>
                <label class="block text-xs font-bold text-slate-600 mb-1">📂 ဖျက်ရန် သို့မဟုတ် ပြင်ရန် အကောင့်ရွေးပါ</label>
                <select id="admin-account-select" class="select-box bg-purple-50 border-purple-200 mb-3">
                    <option value="">-- Save ထားသော အကောင့်ရွေးပါ --</option>
                </select>
                <input type="text" id="save-phone" class="input-box mb-3" placeholder="PromptPay ဖုန်းနံပါတ် / ID">
                <input type="text" id="save-name" class="input-box mb-3" placeholder="အကောင့်နာမည်">
                <input type="text" id="save-note" class="input-box mb-3" placeholder="ဘဏ် / မှတ်စု (Option)">
                <button id="btn-save-account" onclick="saveAccount()" class="btn-primary">💾 အကောင့် Save မည်</button>
                <p class="text-xs text-slate-500 mt-2">ဖုန်းနံပါတ်တူပြီးသားရှိပါက အချက်အလက်ကို update လုပ်ပါမည်။</p>
                <button id="btn-delete-account" onclick="deleteSelectedAccount()" class="w-full mt-3 bg-red-50 text-red-600 border-2 border-red-200 font-bold py-2 rounded-xl hover:bg-red-100">🗑️ ရွေးထားသောအကောင့် ဖျက်မည်</button>
                <hr class="my-3 border-slate-200">
                <button onclick="adminLogout()" class="btn-secondary w-full">Logout</button>
            </div>
            <p id="auth-status" class="text-xs text-slate-500 mt-3">အကောင့် Save လုပ်ရန် Admin Login ဝင်ပါ။</p>
        </div>
    </div>

    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-800">PromptPay QR ထုတ်ရန်</h1>
            <p id="db-status" class="text-sm font-bold text-blue-500 mt-1">🔄 Database ချိတ်ဆက်နေပါသည်...</p>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
            <div class="mb-4">
                <label class="block text-sm font-bold text-purple-700 mb-1">📂 Save ထားသော အကောင့်များ</label>
                <select id="pp-select" class="select-box bg-purple-50 border-purple-200">
                    <option value="">-- ရွေးချယ်ရန် --</option>
                </select>
            </div>
            
            <hr class="my-4 border-slate-200 border-dashed">

            <div class="mb-4">
                <label class="block text-sm font-bold text-slate-700 mb-1">📱 PromptPay No. (ဖုန်း / ID)</label>
                <input type="text" id="pp-id" class="input-box" placeholder="ဥပမာ - 140001234567890">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold text-slate-700 mb-1">👤 အကောင့်နာမည် (Option)</label>
                <input type="text" id="pp-name" class="input-box" placeholder="ဥပမာ - YE LYNN HTUN">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold text-slate-700 mb-1">🏦 ဘဏ် / မှတ်စု (Option)</label>
                <input type="text" id="pp-note" class="input-box" placeholder="ဥပမာ - TrueMoney, K PLUS, SCB">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-bold text-slate-700 mb-1">💰 ပမာဏ (THB)</label>
                <input type="text" id="pp-amount" class="input-box text-xl" placeholder="ဥပမာ - 1,500" inputmode="decimal">
            </div>
            <button id="btn-generate" onclick="generateQR()" class="btn-primary text-lg">QR ထုတ်မည်</button>
        </div>

        <div id="result-area" class="hidden flex flex-col items-center">
            <div id="slip-element" class="slip-container">
                <div class="slip-header">
                    <h2 class="text-2xl font-black tracking-wider">PromptPay</h2>
                    <p class="text-blue-200 text-sm mt-1">Scan to Pay</p>
                </div>
                <div class="slip-body">
                    <div class="absolute inset-0 flex justify-center items-center opacity-[0.03] pointer-events-none text-center leading-tight">
                        <span class="text-3xl font-black transform -rotate-45">Thailand Guide<br>Supplier By Ye</span>
                    </div>

                    <div class="qr-frame relative z-10">
                        <!-- မှတ်စု (Bank Note) ကို QR ပုံရဲ့ အပေါ်ထောင့်စွန်းမှာ တင်ထားပါသည် -->
                        <span id="display-note" class="absolute -top-3 -right-3 bg-slate-600 text-white text-[10px] font-bold px-2 py-1 rounded-md hidden shadow-sm border-2 border-white z-20 uppercase"></span>
                        
                        <img id="qr-image" src="" alt="QR Code" class="w-48 h-48 object-contain">
                    </div>
                    
                    <div class="relative z-10">
                        <h3 id="display-name" class="text-xl font-black text-slate-800 uppercase tracking-wide"></h3>
                        
                        <div id="amt-box-wrapper" class="hidden mt-4 justify-center">
                            <div style="background-color: #eff6ff; border: 2px solid #bfdbfe; border-radius: 12px; padding: 10px 20px; text-align: center; min-width: 200px;">
                                <div style="font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; color: #2563eb; margin-bottom: 2px;">AMOUNT</div>
                                <div id="display-amount-text" style="font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; color: #1e3a8a; margin: 0; padding: 0;"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-50 border-t border-slate-100 p-3 text-center">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Thailand Guide - Supplier By Ye</p>
                </div>
            </div>

            <div class="flex gap-3 w-full max-w-[380px] mt-5">
                <button onclick="saveImage('png', this)" class="btn-secondary flex-1 flex items-center justify-center gap-2">
                    <span>💾</span> PNG သိမ်းမည်
                </button>
                <button onclick="saveImage('jpg', this)" class="btn-secondary flex-1 flex items-center justify-center gap-2">
                    <span>🖼️</span> JPG သိမ်းမည်
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC1ApZQYPm0H8pPbGq_58ceAfsJdLlzw80",
            authDomain: "ppqr-mm.firebaseapp.com",
            projectId: "ppqr-mm",
            storageBucket: "ppqr-mm.firebasestorage.app",
            messagingSenderId: "68224014534",
            appId: "1:68224014534:web:7dab73608a62bc1dd85fc7",
            measurementId: "G-08ZHZT9560"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.settings({ experimentalForceLongPolling: true });

        let FIREBASE_QRS = [];
        let isDbLoaded = false;

        setTimeout(() => {
            if(!isDbLoaded) {
                const statusEl = document.getElementById('db-status');
                statusEl.textContent = '⚠️ အင်တာနက် သို့မဟုတ် Local File ကြောင့် နှေးနေပါသည်';
                statusEl.classList.replace('text-blue-500', 'text-orange-500');
            }
        }, 3000);

        const dbRef = db.collection("exchange_app").doc("admin_data");
        dbRef.get().then((docSnap) => {
            isDbLoaded = true;
            if (docSnap.exists) {
                const data = docSnap.data();
                FIREBASE_QRS = data.qrs || [];
                populateDropdown();
                const statusEl = document.getElementById('db-status');
                statusEl.textContent = '✅ Database ချိတ်ဆက်ပြီးပါပြီ';
                statusEl.classList.remove('text-blue-500', 'text-orange-500');
                statusEl.classList.add('text-green-600');
            } else {
                const statusEl = document.getElementById('db-status');
                statusEl.textContent = '⚠️ Data ရှာမတွေ့ပါ';
                statusEl.classList.replace('text-blue-500', 'text-orange-500');
            }
        }).catch(err => {
            isDbLoaded = true;
            console.error(err);
            const statusEl = document.getElementById('db-status');
            statusEl.textContent = '❌ Connection Error (အင်တာနက် စစ်ဆေးပါ)';
            statusEl.classList.remove('text-blue-500', 'text-orange-500');
            statusEl.classList.add('text-red-500');
        });

        auth.onAuthStateChanged((user) => {
            const loginArea = document.getElementById('login-area');
            const loggedInArea = document.getElementById('logged-in-area');
            const loginBtn = document.getElementById('btn-save-account');
            const authStatus = document.getElementById('auth-status');

            if (user && user.email) {
                loginArea.classList.add('hidden');
                loggedInArea.classList.remove('hidden');
                document.getElementById('logged-in-email').textContent = `✅ ${user.email}`;
                const cornerBtn = document.getElementById('login-corner-btn');
                cornerBtn.textContent = '✅ Admin';
                cornerBtn.classList.remove('bg-slate-800');
                cornerBtn.classList.add('bg-green-600');
                loginBtn.disabled = false;
                loginBtn.textContent = '💾 အကောင့် Save မည်';
                authStatus.textContent = 'Admin အဖြစ် Login ဝင်ထားပါသည်။';
                authStatus.className = 'text-xs text-green-600 mt-2';
                closeLoginModal();
            } else {
                loginArea.classList.remove('hidden');
                loggedInArea.classList.add('hidden');
                const cornerBtn = document.getElementById('login-corner-btn');
                cornerBtn.textContent = '🔐 Login';
                cornerBtn.classList.remove('bg-green-600');
                cornerBtn.classList.add('bg-slate-800');
                loginBtn.disabled = true;
                loginBtn.textContent = '🔒 Admin Login လိုသည်';
                authStatus.textContent = 'အကောင့် Save လုပ်ရန် Admin Login ဝင်ပါ။';
                authStatus.className = 'text-xs text-slate-500 mt-2';
            }
        });

        function openLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeLoginModal() {
            const modal = document.getElementById('login-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function adminLogin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const loginBtn = document.getElementById('btn-login');

            if (!email || !password) {
                alert('Admin Email နဲ့ Password နှစ်ခုလုံးထည့်ပါ။');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'ဝင်နေသည်...';
            try {
                await auth.signInWithEmailAndPassword(email, password);
                document.getElementById('admin-password').value = '';
            } catch (error) {
                console.error(error);
                alert('❌ Login မအောင်မြင်ပါ။');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login ဝင်မည်';
            }
        }

        function adminLogout() {
            auth.signOut();
        }

        async function saveAccount() {
            const phone = document.getElementById('save-phone').value.trim();
            const name = document.getElementById('save-name').value.trim();
            const note = document.getElementById('save-note').value.trim();
            const saveBtn = document.getElementById('btn-save-account');

            if (!phone) {
                alert('Save မလုပ်ခင် PromptPay ဖုန်းနံပါတ် သို့မဟုတ် ID ထည့်ပေးပါ။');
                return;
            }

            if (!/^\d{8,15}$/.test(phone)) {
                alert('ဖုန်းနံပါတ်/ID ကို ဂဏန်း ၈ လုံးမှ ၁၅ လုံးအတွင်း ထည့်ပေးပါ။');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ Save လုပ်နေသည်...';

            try {
                if (!auth.currentUser || !auth.currentUser.email) {
                    throw new Error('Admin login required');
                }
                await auth.currentUser.getIdToken(true);
                const snapshot = await dbRef.get();
                const existingData = snapshot.exists ? snapshot.data() : {};
                const accounts = Array.isArray(existingData.qrs) ? existingData.qrs : [];
                
                const newAccount = {
                    file: `PP:${phone}`,
                    name: name || 'PromptPay Account',
                    owner: name || '',
                    note: note || ''
                };

                const index = accounts.findIndex(item => {
                    const file = typeof item === 'string' ? item : item?.file;
                    return file === `PP:${phone}`;
                });

                if (index >= 0) {
                    accounts[index] = newAccount;
                } else {
                    accounts.push(newAccount);
                }

                await dbRef.set({ qrs: accounts }, { merge: true });
                FIREBASE_QRS = accounts;
                populateDropdown();
                document.getElementById('save-phone').value = '';
                document.getElementById('save-name').value = '';
                document.getElementById('save-note').value = '';
                alert(index >= 0 ? '✅ အကောင့်အချက်အလက် ပြင်ပြီးပါပြီ။' : '✅ အကောင့် Save ပြီးပါပြီ။');
            } catch (error) {
                console.error(error);
                alert('❌ Save မလုပ်နိုင်ပါ။');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 အကောင့် Save မည်';
            }
        }

        async function deleteSelectedAccount() {
            const select = document.getElementById('admin-account-select');
            const deleteBtn = document.getElementById('btn-delete-account');

            if (!auth.currentUser || !auth.currentUser.email) {
                alert('ဖျက်ရန် Admin Login ဝင်ထားရပါမယ်။');
                return;
            }

            if (!select.value) {
                alert('ဖျက်လိုသောအကောင့်ကို အောက်ကစာရင်းထဲမှ အရင်ရွေးပါ။');
                return;
            }

            const selected = JSON.parse(select.value);
            if (!confirm(`${selected.phone} အကောင့်ကို တကယ်ဖျက်မလား?`)) return;

            deleteBtn.disabled = true;
            deleteBtn.textContent = '⏳ ဖျက်နေသည်...';

            try {
                await auth.currentUser.getIdToken(true);
                const snapshot = await dbRef.get();
                const data = snapshot.exists ? snapshot.data() : {};
                const accounts = Array.isArray(data.qrs) ? data.qrs : [];
                const filtered = accounts.filter(item => {
                    const file = typeof item === 'string' ? item : item?.file;
                    return file !== `PP:${selected.phone}`;
                });

                await dbRef.set({ qrs: filtered }, { merge: true });
                FIREBASE_QRS = filtered;
                populateDropdown();
                document.getElementById('save-phone').value = '';
                document.getElementById('save-name').value = '';
                document.getElementById('save-note').value = '';
                alert('✅ အကောင့်ဖျက်ပြီးပါပြီ။');
            } catch (error) {
                console.error(error);
                alert('❌ အကောင့်ဖျက်မရပါ။');
            } finally {
                deleteBtn.disabled = false;
                deleteBtn.textContent = '🗑️ ရွေးထားသောအကောင့် ဖျက်မည်';
            }
        }

        function populateDropdown() {
            const select = document.getElementById('pp-select');
            const adminSelect = document.getElementById('admin-account-select');
            select.innerHTML = '<option value="">-- Save ထားသော အကောင့်ရွေးပါ --</option>';
            adminSelect.innerHTML = '<option value="">-- Save ထားသော အကောင့်ရွေးပါ --</option>';
            
            FIREBASE_QRS.forEach(qr => {
                const file = typeof qr === 'string' ? qr : qr.file;
                const name = typeof qr === 'string' ? qr.replace(/\.[^.]+$/, '') : (qr.name || file);
                const owner = (typeof qr === 'object' && qr.owner) ? qr.owner : '';
                const note = (typeof qr === 'object' && qr.note) ? qr.note : '';
                
                if (file.startsWith('PP:')) {
                    const phone = file.split(':')[1];
                    const option = document.createElement('option');
                    option.value = JSON.stringify({ phone: phone, name: owner || name, note: note });
                    let displayName = owner && owner !== name ? `${name} (${owner})` : name;
                    option.textContent = `${phone} - ${displayName}`;
                    select.appendChild(option);
                    adminSelect.appendChild(option.cloneNode(true));
                }
            });
        }

        document.getElementById('admin-account-select').addEventListener('change', function() {
            if (!this.value) {
                document.getElementById('save-phone').value = '';
                document.getElementById('save-name').value = '';
                document.getElementById('save-note').value = '';
                return;
            }
            const data = JSON.parse(this.value);
            document.getElementById('save-phone').value = data.phone || '';
            document.getElementById('save-name').value = data.name || '';
            document.getElementById('save-note').value = data.note || '';
        });

        document.getElementById('pp-select').addEventListener('change', function() {
            if(!this.value) {
                document.getElementById('pp-id').value = '';
                document.getElementById('pp-name').value = '';
                document.getElementById('pp-note').value = '';
                return;
            }
            const data = JSON.parse(this.value);
            document.getElementById('pp-id').value = data.phone || '';
            document.getElementById('pp-name').value = data.name || '';
            document.getElementById('pp-note').value = data.note || ''; 
        });

        const amtInput = document.getElementById('pp-amount');
        amtInput.addEventListener('input', function(e) {
            let value = this.value.replace(/[^\d.]/g, '');
            const parts = value.split('.');
            if (parts.length > 2) value = parts[0] + '.' + parts.slice(1).join('');
            
            if (value !== '') {
                if (value.includes('.')) {
                    this.value = (parts[0] ? Number(parts[0]).toLocaleString('en-US') : '0') + '.' + parts.slice(1).join('');
                } else {
                    this.value = Number(value).toLocaleString('en-US');
                }
            } else {
                this.value = '';
            }
        });

        function generatePromptPayPayload(id, amount) {
            let cleanId = id.replace(/[^0-9]/g, '');
            let target = "";
            
            if (cleanId.length >= 15) {
                target = "03" + String(cleanId.length).padStart(2, '0') + cleanId;
            } else if (cleanId.length === 13) {
                target = "0213" + cleanId; 
            } else if (cleanId.length === 10) {
                target = "01130066" + cleanId.substring(1);
            } else {
                target = "03" + String(cleanId.length).padStart(2, '0') + cleanId;
            }
            
            let tag29 = "0016A000000677010111" + target;
            let payload = "00020101021" + (amount > 0 ? "2" : "1") + 
                          "29" + String(tag29.length).padStart(2, '0') + tag29 + 
                          "5802TH5303764";
                          
            if (amount > 0) {
                let amtStr = parseFloat(amount).toFixed(2);
                payload += "54" + String(amtStr.length).padStart(2, '0') + amtStr;
            }
            
            payload += "6304";
            
            let crc = 0xFFFF;
            for (let i = 0; i < payload.length; i++) {
                crc ^= (payload.charCodeAt(i) << 8);
                for (let j = 0; j < 8; j++) {
                    if (crc & 0x8000) {
                        crc = ((crc << 1) ^ 0x1021);
                    } else {
                        crc = (crc << 1);
                    }
                    crc &= 0xFFFF;
                }
            }
            let crcHex = crc.toString(16).toUpperCase().padStart(4, '0');
            return payload + crcHex;
        }

        function generateQR() {
            const ppId = document.getElementById('pp-id').value.trim();
            const ppName = document.getElementById('pp-name').value.trim();
            const ppNote = document.getElementById('pp-note').value.trim();
            const rawAmt = document.getElementById('pp-amount').value.replace(/,/g, '');
            
            if (!ppId) {
                alert('PromptPay ဖုန်းနံပါတ် သို့မဟုတ် ID ထည့်ပေးပါ။');
                return;
            }

            if (typeof QRious === 'undefined') {
                alert('အင်တာနက်ချိတ်ဆက်မှု မကောင်းသဖြင့် စနစ်ကို Load လုပ်၍မရသေးပါ။ စက္ကန့်အနည်းငယ်စောင့်၍ ပြန်နှိပ်ပါ။');
                return;
            }

            const btn = document.getElementById('btn-generate');
            const originalText = btn.textContent;
            btn.textContent = 'ထုတ်လုပ်နေသည်...';
            btn.disabled = true;

            const amtNum = parseFloat(rawAmt) || 0;
            document.getElementById('display-name').innerHTML = ppName || 'PROMPTPAY ACCOUNT';
            
            // Note နေရာသစ်
            const noteEl = document.getElementById('display-note');
            if (ppNote) {
                noteEl.innerText = ppNote;
                noteEl.classList.remove('hidden');
                noteEl.style.display = 'block'; // Ensure visibility
            } else {
                noteEl.innerText = '';
                noteEl.classList.add('hidden');
                noteEl.style.display = 'none';
            }
            
            const amtWrapper = document.getElementById('amt-box-wrapper');
            const amtText = document.getElementById('display-amount-text');
            
            if (amtNum > 0) {
                amtText.innerText = amtNum.toLocaleString('en-US', {minimumFractionDigits: 2}) + ' THB';
                amtWrapper.classList.remove('hidden');
                amtWrapper.classList.add('flex');
            } else {
                amtWrapper.classList.add('hidden');
                amtWrapper.classList.remove('flex');
                amtText.innerText = '';
            }

            try {
                const payload = generatePromptPayPayload(ppId, amtNum);
                const qr = new QRious({
                    value: payload,
                    size: 400,
                    level: 'H'
                });
                
                const qrImg = document.getElementById('qr-image');
                qrImg.src = qr.toDataURL('image/png');
                
                qrImg.onload = () => {
                    document.getElementById('result-area').classList.remove('hidden');
                    btn.textContent = originalText;
                    btn.disabled = false;
                };
            } catch (error) {
                console.error(error);
                alert('Error ဖြစ်နေပါသည်။ ' + error.message);
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        async function saveImage(format, btnEl) {
            const slip = document.getElementById('slip-element');
            const originalText = btnEl.innerHTML;
            btnEl.innerHTML = '⏳ သိမ်းနေသည်...';
            btnEl.disabled = true;

            try {
                await document.fonts?.ready;
                await new Promise(r => setTimeout(r, 800));

                const canvas = await html2canvas(slip, {
                    scale: 3, 
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false,
                    onclone: function (doc) {
                        const amtWrapper = doc.getElementById('amt-box-wrapper');
                        const amtText = doc.getElementById('display-amount-text');
                        if (amtText && amtText.innerText.trim() !== '') {
                            amtWrapper.style.display = 'flex';
                            amtText.style.color = '#1e3a8a';
                        }
                        
                        const noteEl = doc.getElementById('display-note');
                        if (noteEl && noteEl.innerText.trim() !== '') {
                            noteEl.style.display = 'block';
                            noteEl.classList.remove('hidden');
                        }
                    }
                });

                const margin = 20;
                const outCanvas = document.createElement('canvas');
                outCanvas.width = canvas.width + (margin * 2);
                outCanvas.height = canvas.height + (margin * 2);
                const ctx = outCanvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, outCanvas.width, outCanvas.height);
                ctx.drawImage(canvas, margin, margin);

                const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
                const fileExt = format === 'jpg' ? '.jpg' : '.png';
                const fileName = `PromptPay_${Date.now()}${fileExt}`;

                outCanvas.toBlob(async (blob) => {
                    if (!blob) return;

                    const ua = navigator.userAgent || navigator.vendor || window.opera;
                    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
                    const isInAppBrowser = /FBAN|FBAV|Line|MicroMessenger|Viber|Instagram|Snapchat/i.test(ua);

                    if (isInAppBrowser) {
                        const url = URL.createObjectURL(blob);
                        window.open(url, '_blank');
                    } else if (isIOS && navigator.canShare) {
                        const file = new File([blob], fileName, { type: mimeType });
                        try {
                            await navigator.share({ files: [file] });
                        } catch(e) {}
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                    }
                    
                    btnEl.innerHTML = '✅ ရပါပြီ';
                    setTimeout(() => {
                        btnEl.innerHTML = originalText;
                        btnEl.disabled = false;
                    }, 2000);
                }, mimeType, 0.95);

            } catch (error) {
                alert('ပုံသိမ်းဆည်းရာတွင် အခက်အခဲရှိပါသည်။');
                btnEl.innerHTML = originalText;
                btnEl.disabled = false;
            }
        }
    </script>
